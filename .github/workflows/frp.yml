name: Build iOS frp (with Web UI)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '目标 CPU 架构'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - arm

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 构建 frpc 的前端
      - name: Build frpc web UI
        run: |
          cd web/frpc
          npm ci
          npm run build
          ls -la dist

      # 构建 frps 的前端
      - name: Build frps web UI
        run: |
          cd web/frps
          npm ci
          npm run build
          ls -la dist

      # 编译 frpc (iOS)
      - name: Build frpc for iOS (${{ inputs.arch }})
        run: |
          cd cmd/frpc
          GOOS=ios GOARCH=${{ inputs.arch }} CGO_ENABLED=0 go build -o frpc_ios_${{ inputs.arch }}
          cd ../..
          mv cmd/frpc/frpc_ios_${{ inputs.arch }} .

      # 编译 frps (iOS)
      - name: Build frps for iOS (${{ inputs.arch }})
        run: |
          cd cmd/frps
          GOOS=ios GOARCH=${{ inputs.arch }} CGO_ENABLED=0 go build -o frps_ios_${{ inputs.arch }}
          cd ../..
          mv cmd/frps/frps_ios_${{ inputs.arch }} .

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: frp-ios-${{ inputs.arch }}-with-web
          path: |
            frpc_ios_${{ inputs.arch }}
            frps_ios_${{ inputs.arch }}
