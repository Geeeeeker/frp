name: Build iOS frp (static, signed with ldid)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release 版本号 (例如: v0.54.0) - 仅在创建 Release 时需要'
        required: false
        type: string
      arch:
        description: '目标 CPU 架构 (arm64 for iPhone 6s)'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - arm
      include_web:
        description: '是否包含 Web 管理界面'
        required: true
        default: false
        type: boolean
      create_release:
        description: '是否创建 GitHub Release'
        required: true
        default: false
        type: boolean

jobs:
  build:
    name: Build and Package (static, signed)
    runs-on: macos-latest
    outputs:
      deb_name: ${{ steps.set_outputs.outputs.deb_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      # 仅在需要 Web UI 时构建前端
      - name: Setup Node.js
        if: inputs.include_web == true
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frpc web UI
        if: inputs.include_web == true
        run: |
          cd web/frpc
          npm ci
          npm run build

      - name: Build frps web UI
        if: inputs.include_web == true
        run: |
          cd web/frps
          npm ci
          npm run build

      # 静态编译 frpc
      - name: Build frpc for iOS (${{ inputs.arch }})
        run: |
          cd cmd/frpc
          BUILD_TAGS=""
          if [[ "${{ inputs.include_web }}" == "false" ]]; then
            BUILD_TAGS="-tags release"
          fi
          CGO_ENABLED=0 GOOS=ios GOARCH=${{ inputs.arch }} go build $BUILD_TAGS -o frpc
          cd ../..
          mkdir -p build/usr/local/bin
          cp cmd/frpc/frpc build/usr/local/bin/

      # 静态编译 frps
      - name: Build frps for iOS (${{ inputs.arch }})
        run: |
          cd cmd/frps
          BUILD_TAGS=""
          if [[ "${{ inputs.include_web }}" == "false" ]]; then
            BUILD_TAGS="-tags release"
          fi
          CGO_ENABLED=0 GOOS=ios GOARCH=${{ inputs.arch }} go build $BUILD_TAGS -o frps
          cd ../..
          cp cmd/frps/frps build/usr/local/bin/

      # 安装 ldid 并签名
      - name: Install ldid
        run: brew install ldid

      - name: Sign binaries with ldid
        run: |
          ldid -S build/usr/local/bin/frpc
          ldid -S build/usr/local/bin/frps
          echo "✅ Signed frpc and frps"

      - name: Set Outputs
        id: set_outputs
        run: |
          DEB_NAME="frp-ios_${{ inputs.version || 'latest' }}_${{ inputs.arch }}.deb"
          echo "deb_name=${DEB_NAME}" >> $GITHUB_OUTPUT

      # 安装 dpkg 并打包 .deb
      - name: Install dpkg
        run: brew install dpkg

      - name: Package .deb
        run: |
          mkdir -p build/DEBIAN
          cat > build/DEBIAN/control <<EOF
          Package: frp-ios
          Version: ${{ inputs.version || '0.0.0' }}
          Architecture: iphoneos-arm${{ inputs.arch == 'arm64' && '64' || '' }}
          Maintainer: GitHub Actions <actions@github.com>
          Description: A fast reverse proxy (static, signed with ldid)
          Section: Networking
          Priority: optional
          Homepage: https://github.com/fatedier/frp
          EOF
          # 可选 postinst 脚本，安装后再次尝试签名
          cat > build/DEBIAN/postinst <<'EOF'
          #!/bin/bash
          if command -v ldid &> /dev/null; then
            ldid -S /usr/local/bin/frpc 2>/dev/null || true
            ldid -S /usr/local/bin/frps 2>/dev/null || true
          fi
          exit 0
          EOF
          chmod +x build/DEBIAN/postinst
          dpkg-deb --build build ${{ steps.set_outputs.outputs.deb_name }}

      # 上传二进制文件（已签名）作为 Artifact
      - name: Upload binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: frp-binaries-${{ inputs.arch }}-signed
          path: |
            build/usr/local/bin/frpc
            build/usr/local/bin/frps
          if-no-files-found: error

      # 上传 .deb 包作为 Artifact
      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set_outputs.outputs.deb_name }}
          path: ${{ steps.set_outputs.outputs.deb_name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: inputs.create_release == true && inputs.version != ''
    permissions:
      contents: write
    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.deb_name }}

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          body: |
            ## iOS 版 frp ${{ inputs.version }}
            
            ### 包含组件
            - `frpc` (客户端)
            - `frps` (服务端)
            - **已使用 `ldid` 签名**，解决 `Killed: 9` 问题
            - **静态编译 (`CGO_ENABLED=0`)**，无动态库依赖，避免 `dyld` 错误
            
            ### 编译信息
            - 架构: `${{ inputs.arch }}`
            - Web 界面: ${{ inputs.include_web && '开启' || '关闭' }}
            - 最低 iOS 版本: 10.0
            
            ### 安装说明
            1. 下载 `.deb` 文件并通过 Sileo/Cydia/Filza 安装。
            2. 安装后二进制文件位于 `/usr/local/bin/frpc` 和 `/usr/local/bin/frps`。
            3. 如果运行仍报 `Killed: 9`，请在终端手动执行：
               ```bash
               ldid -S /usr/local/bin/frpc
               ldid -S /usr/local/bin/frps
