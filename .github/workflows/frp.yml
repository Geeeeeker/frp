name: Build iOS frp (with optional Web UI)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release 版本号 (例如: v0.54.0)'
        required: false
        type: string
      arch:
        description: '目标 CPU 架构 (arm64 for iPhone 6s)'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - arm
      include_web:
        description: '是否包含 Web 管理界面'
        required: true
        default: false
        type: boolean
      create_release:
        description: '是否创建 GitHub Release'
        required: true
        default: false
        type: boolean

jobs:
  build:
    name: Build and Package
    runs-on: macos-latest
    outputs:
      deb_name: ${{ steps.set_outputs.outputs.deb_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Setup Node.js
        if: inputs.include_web == true
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frpc web UI
        if: inputs.include_web == true
        run: |
          cd web/frpc
          npm ci
          npm run build

      - name: Build frps web UI
        if: inputs.include_web == true
        run: |
          cd web/frps
          npm ci
          npm run build

      - name: Configure iOS SDK
        run: |
          echo "SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV
          echo "CC=$(xcrun --sdk iphoneos -f clang)" >> $GITHUB_ENV

      - name: Build frpc for iOS (${{ inputs.arch }})
        run: |
          cd cmd/frpc
          BUILD_TAGS=""
          if [[ "${{ inputs.include_web }}" == "false" ]]; then
            BUILD_TAGS="-tags release"
          fi
          CGO_ENABLED=1 \
          GOOS=ios \
          GOARCH=${{ inputs.arch }} \
          CC=${{ env.CC }} \
          CGO_CFLAGS="-isysroot ${{ env.SDK_PATH }} -arch ${{ inputs.arch }} -miphoneos-version-min=10.0" \
          CGO_LDFLAGS="-isysroot ${{ env.SDK_PATH }} -arch ${{ inputs.arch }}" \
          go build $BUILD_TAGS -o frpc
          cd ../..
          mkdir -p build/usr/local/bin
          cp cmd/frpc/frpc build/usr/local/bin/

      - name: Build frps for iOS (${{ inputs.arch }})
        run: |
          cd cmd/frps
          BUILD_TAGS=""
          if [[ "${{ inputs.include_web }}" == "false" ]]; then
            BUILD_TAGS="-tags release"
          fi
          CGO_ENABLED=1 \
          GOOS=ios \
          GOARCH=${{ inputs.arch }} \
          CC=${{ env.CC }} \
          CGO_CFLAGS="-isysroot ${{ env.SDK_PATH }} -arch ${{ inputs.arch }} -miphoneos-version-min=10.0" \
          CGO_LDFLAGS="-isysroot ${{ env.SDK_PATH }} -arch ${{ inputs.arch }}" \
          go build $BUILD_TAGS -o frps
          cd ../..
          cp cmd/frps/frps build/usr/local/bin/

      - name: Set Outputs
        id: set_outputs
        run: |
          DEB_NAME="frp-ios_${{ inputs.version || 'latest' }}_${{ inputs.arch }}.deb"
          echo "deb_name=${DEB_NAME}" >> $GITHUB_OUTPUT

      - name: Install dpkg
        run: brew install dpkg

      - name: Package .deb
        run: |
          mkdir -p build/DEBIAN
          cat > build/DEBIAN/control <<EOF
          Package: frp-ios
          Version: ${{ inputs.version || '0.0.0' }}
          Architecture: iphoneos-arm${{ inputs.arch == 'arm64' && '64' || '' }}
          Maintainer: GitHub Actions <actions@github.com>
          Description: A fast reverse proxy to help you expose a local server behind a NAT or firewall to the internet.
          Section: Networking
          Priority: optional
          Homepage: https://github.com/fatedier/frp
          EOF
          cat > build/DEBIAN/postinst <<EOF
          #!/bin/bash
          if command -v ldid &> /dev/null; then
            ldid -S /usr/local/bin/frpc
            ldid -S /usr/local/bin/frps
          fi
          exit 0
          EOF
          chmod +x build/DEBIAN/postinst
          dpkg-deb --build build ${{ steps.set_outputs.outputs.deb_name }}

      - name: Upload Artifacts (二进制文件)
        uses: actions/upload-artifact@v4
        with:
          name: frp-binaries-${{ inputs.arch }}
          path: |
            build/usr/local/bin/frpc
            build/usr/local/bin/frps
          if-no-files-found: error

      - name: Upload Artifacts (.deb 包)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set_outputs.outputs.deb_name }}
          path: ${{ steps.set_outputs.outputs.deb_name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: inputs.create_release == true && inputs.version != ''
    permissions:
      contents: write
    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.deb_name }}

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          body: |
            ## iOS 版 frp ${{ inputs.version }}
            
            ### 包含组件
            - frpc (客户端)
            - frps (服务端)
            
            ### 编译信息
            - 架构: ${{ inputs.arch }}
            - Web 界面: ${{ inputs.include_web && '开启' || '关闭' }}
            - 最低 iOS 版本: 10.0
          files: ${{ needs.build.outputs.deb_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
